<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mockup TBNgoài</title>
<style>
:root{--r:14px;--sp:12px;--font:"Be Vietnam Pro","Inter",system-ui,sans-serif}
.vA{--brand:#0b3b6f;--acc:#0ea5c6;--bg:#f4f6fa;--card:#fff;--tx:#0f172a;--mut:#64748b;--line:#e2e8f0}
.vB{--brand:#7c2d12;--acc:#f59e0b;--bg:#faf7f2;--card:#fff;--tx:#1c1917;--mut:#78716c;--line:#ece6dc}
.vC{--brand:#065f46;--acc:#10b981;--bg:#f3f7f5;--card:#fff;--tx:#0f172a;--mut:#5b6b66;--line:#dfe8e4}
.dark.vA{--brand:#4f9be8;--acc:#22d3ee;--bg:#0b1220;--card:#131c2e;--tx:#e5edf7;--mut:#8ea0b8;--line:#22304a}
.dark.vB{--brand:#fbbf24;--acc:#f59e0b;--bg:#14110d;--card:#1f1a14;--tx:#f5efe6;--mut:#a8a29e;--line:#332b21}
.dark.vC{--brand:#34d399;--acc:#10b981;--bg:#0a1311;--card:#12201c;--tx:#e6f2ee;--mut:#8aa59c;--line:#1f3530}
*{box-sizing:border-box}html,body{margin:0;height:100dvh;font-family:var(--font);background:var(--bg);color:var(--tx);font-size:15px}
.top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.top h1{font-size:17px;margin:0;font-weight:700;flex:1}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);color:var(--tx)}
.chip{padding:6px 10px;border-radius:99px;border:1px solid var(--line);font-size:13px;white-space:nowrap;background:var(--card)}
.chip.on{background:var(--brand);color:#fff;border-color:transparent}.dark .chip.on{color:#0b1220}
.row{display:flex;gap:8px;overflow:auto;padding:10px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04)}
.list{display:grid;gap:10px;padding:0 14px 100px}
.it{display:flex;gap:12px;align-items:flex-start}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);flex:none}
.t{font-weight:650}.m{color:var(--mut);font-size:13px;margin-top:2px}
.bd{font-size:11.5px;padding:3px 8px;border-radius:99px;font-weight:600}
.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}
.dark .ok{background:#14532d;color:#bbf7d0}.dark .warn{background:#78350f;color:#fde68a}.dark .bad{background:#7f1d1d;color:#fecaca}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);background:var(--card);border-top:1px solid var(--line)}
.tab{display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--mut);min-width:56px}.tab.on{color:var(--brand)}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 78px);width:60px;height:60px;border-radius:20px;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.dark .fab{color:#0b1220}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px 14px}
.kpi .n{font-size:26px;font-weight:750;font-variant-numeric:tabular-nums}.kpi .l{color:var(--mut);font-size:12.5px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;display:flex}.bar i{display:block;height:100%}
.sec{padding:4px 14px;font-weight:700;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.map{position:fixed;inset:0;background:
 linear-gradient(90deg,transparent 48%,color-mix(in srgb,var(--mut) 25%,transparent) 48% 52%,transparent 52%) 0 0/180px 100%,
 linear-gradient(0deg,transparent 46%,color-mix(in srgb,var(--mut) 22%,transparent) 46% 50%,transparent 50%) 0 0/100% 150px,
 linear-gradient(35deg,transparent 49%,color-mix(in srgb,var(--mut) 18%,transparent) 49% 51%,transparent 51%),var(--bg)}
.pin{position:absolute;width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);padding:8px 0 calc(env(safe-area-inset-bottom) + 10px);max-height:52dvh;overflow:auto}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 8px}
.search{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;padding:0 12px;color:var(--mut)}
.float{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;gap:8px}
/* form */
.f{padding:12px 14px 120px;display:grid;gap:12px}
.fl label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px;font-weight:600}
.in{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;padding:0 12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.seg div{height:48px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;text-align:center;background:var(--card)}
.seg .s{border:2px solid var(--brand);font-weight:650}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gps{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--acc) 12%,transparent);font-size:13px}
.save{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 12px);height:54px;border-radius:16px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700}
.dark .save{color:#0b1220}
.ph{display:flex;gap:8px}.ph div{width:72px;height:72px;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--mut)}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.side{display:none}
@media (orientation:landscape) and (max-height:520px){
 .top{padding-left:calc(env(safe-area-inset-left) + 14px)}
 .lay{display:grid;grid-template-columns:40% 1fr;height:calc(100dvh - 65px)}
 .lay>*{overflow:auto}.kpis{grid-template-columns:repeat(2,1fr)}
 .tabs{left:auto;top:65px;bottom:0;width:72px;flex-direction:column;justify-content:flex-start;gap:14px;border-top:0;border-left:1px solid var(--line);padding-top:14px}
 .fab{bottom:16px;right:90px}.list{padding-right:86px}
 .sheet{left:auto;right:0;top:0;width:44%;max-height:none;border-radius:22px 0 0 22px}
 .f{grid-template-columns:1fr 1fr;padding-bottom:80px}.f .full{grid-column:1/-1}
 .save{left:auto;width:220px}
}
</style></head>
<body>
<div id="app"></div>
<script>
const q=new URLSearchParams(location.search),V=q.get('v')||'A',S=q.get('screen')||'home';
document.body.className='v'+V+(q.get('theme')==='dark'?' dark':'');
const I={list:'<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
map:'<svg viewBox="0 0 24 24"><path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3zM9 3v15M15 6v15"/></svg>',
chart:'<svg viewBox="0 0 24 24"><path d="M3 3v18h18M7 15v3M12 10v8M17 6v12"/></svg>',
plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
menu:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',
back:'<svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
cam:'<svg viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>',
wifi:'<svg viewBox="0 0 24 24"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M2 9a15 15 0 0 1 20 0M12 20h.01"/></svg>',
wind:'<svg viewBox="0 0 24 24"><path d="M17.7 7.7A2.5 2.5 0 1 1 19.5 12H2M9.6 4.6A2 2 0 1 1 11 8H2M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>',
zap:'<svg viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>',
star:'<svg viewBox="0 0 24 24"><path d="m12 2 3 7h7l-5.5 4.5 2 7L12 16l-6.5 4.5 2-7L2 9h7z"/></svg>',
alert:'<svg viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>',
pin:'<svg viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>'};
const items=[
['cam','Camera giám sát ×2','Công an TP · Trụ 12/T-NTMK · Q.1','bad','Không VB'],
['wifi','Trạm phát sóng nhỏ','Viettel · Trụ 05/LL3 · Q.3','ok','Có HĐ'],
['wind','Quan trắc không khí','Sở TN&MT · Trụ 21/PN · Phú Nhuận','warn','Đấu lưới, không công tơ'],
['star','Đèn dây lễ hội ×40','UBND P.Bến Thành · Trụ 03→18/LL · Q.1','warn','Quá hạn tháo 3 ngày'],
['zap','Công tơ','EVN HCMC · Trụ 44/BT · Bình Thạnh','ok','Có HĐ']];
const listHTML=items.map(([i,t,m,c,b])=>`<div class="card it"><div class="ic">${I[i]}</div><div style="flex:1;min-width:0"><div class="t">${t}</div><div class="m">${m}</div></div><span class="bd ${c}">${b}</span></div>`).join('');
const chips=`<div class="row">${['Tất cả quận','Q.1','Q.3','Q.5','Bình Thạnh','Phú Nhuận'].map((c,i)=>`<span class="chip ${i?'':'on'}">${c}</span>`).join('')}</div>`;
const tabs=(on)=>`<nav class="tabs">${[['list','Danh sách'],['map','Bản đồ'],['chart','Thống kê'],['menu','Khác']].map(([i,l])=>`<div class="tab ${i===on?'on':''}">${I[i]}<span>${l}</span></div>`).join('')}</nav>`;
const kpi=(n,l,c)=>`<div class="card kpi"><div class="n" style="color:${c||'inherit'}">${n}</div><div class="l">${l}</div></div>`;
const kpis=`<div class="kpis">${kpi('1.284','vị trí trụ · 2.031 thiết bị')}${kpi('37','nguy hiểm','#dc2626')}${kpi('212','không có văn bản','#d97706')}${kpi('96','đấu lưới CS, không công tơ','#d97706')}</div>`;
const groups=`<div class="card" style="margin:0 14px;display:grid;gap:10px">${[['Viễn thông',612,'#0ea5c6'],['Camera / giao thông',418,'#6366f1'],['Đèn lễ hội',152,'#f59e0b'],['Quan trắc MT',61,'#10b981'],['Đo điện',41,'#64748b']].map(([n,v,c])=>`<div><div style="display:flex;justify-content:space-between;font-size:13px"><span>${n}</span><b>${v}</b></div><div class="bar"><i style="width:${v/6.2}%;background:${c}"></i></div></div>`).join('')}</div>`;
const alerts=`<div class="sec" style="margin-top:12px">Cần xử lý</div><div class="list" style="padding-bottom:100px">${items.filter(x=>x[3]!=='ok').map(([i,t,m,c,b])=>`<div class="card it"><div class="ic" style="color:#dc2626;background:#fee2e2">${I.alert}</div><div style="flex:1"><div class="t">${b}</div><div class="m">${t} · ${m}</div></div></div>`).join('')}</div>`;
const form=`<header class="top"><div class="ib">${I.back}</div><h1>Thêm thiết bị</h1><span class="chip">Nháp đã lưu</span></header>
<div class="f"><div class="gps full">${I.pin}<div style="flex:1"><b>10.7769, 106.7009</b> · ±8 m<div class="m">Q.1 · P.Bến Nghé (tự nhận)</div></div><span class="chip">Lấy lại</span></div>
<div class="g2"><div class="fl"><label>Tủ điều khiển *</label><div class="in">NTMK-02</div></div><div class="fl"><label>Số trụ *</label><div class="in">12</div></div></div>
<div class="fl"><label>Tuyến đường *</label><div class="in">Nguyễn Thị Minh Khai</div></div>
<div class="fl full"><label>Nhóm thiết bị *</label><div class="seg"><div>Quan trắc</div><div class="s">Camera / GT</div><div>Viễn thông</div><div>Đo điện</div><div>Lễ hội</div></div></div>
<div class="g2"><div class="fl"><label>Đơn vị chủ quản *</label><div class="in">Công an TP</div></div><div class="fl"><label>Số lượng *</label><div class="in">2</div></div></div>
<div class="fl"><label>Pháp lý *</label><div class="seg"><div>Có VB/HĐ</div><div>Đang làm TT</div><div class="s">Không VB</div></div></div>
<div class="fl"><label>Cấp nguồn *</label><div class="seg"><div class="s">Lưới CS</div><div>Nguồn riêng</div><div>Pin/NLMT</div></div></div>
<div class="fl"><label>An toàn *</label><div class="seg"><div>Đạt</div><div>Cần KP</div><div class="s" style="border-color:#dc2626">Nguy hiểm</div></div></div>
<div class="fl full"><label>Ảnh hiện trường (tối đa 3)</label><div class="ph"><div>${I.cam}</div><div>${I.plus}</div><div>${I.plus}</div></div></div></div>
<div class="save">Lưu</div>`;
let h='';
if(S==='form') h=form;
else if(V==='A') h=`<header class="top"><h1>Thiết bị ngoài trên trụ</h1><div class="ib">${I.search}</div></header><div class="lay"><div>${chips}${kpis}</div><div><div class="sec" style="padding-top:10px">Mới cập nhật</div><div class="list">${listHTML}</div></div></div><div class="fab">${I.plus}</div>${tabs('list')}`;
else if(V==='B') h=`<header class="top"><h1>Tổng quan KVTT</h1><span class="chip on">Tháng 11</span></header><div class="lay"><div>${kpis}<div class="sec">Theo nhóm</div>${groups}</div><div>${alerts}</div></div><div class="fab">${I.plus}</div>${tabs('chart')}`;
else h=`<div class="map">${[[22,30,'#dc2626'],[48,22,'#16a34a'],[62,40,'#f59e0b'],[30,52,'#16a34a'],[75,18,'#dc2626'],[55,58,'#16a34a'],[40,36,'#f59e0b']].map(([x,y,c])=>`<span class="pin" style="left:${x}%;top:${y}%;background:${c}"></span>`).join('')}</div>
<div class="float"><div class="search">${I.search}&nbsp; Tìm tuyến, trụ, đơn vị…</div><div class="ib">${I.menu}</div></div>
<div class="sheet"><div class="grab"></div>${chips}<div class="list" style="padding-bottom:20px">${listHTML}</div></div><div class="fab" style="bottom:calc(52dvh + 14px)">${I.plus}</div>`;
document.getElementById('app').innerHTML=h;
</script></body></html>
